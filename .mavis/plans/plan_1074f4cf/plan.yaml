      - DELETE /test-drives/:id (cancel)
      - POST   /test-drives/:id/start (record start odometer, mark IN_PROGRESS)
      - POST   /test-drives/:id/complete (record end odometer, interest rating, next step)
      - POST   /test-drives/:id/upload-dl (multipart, returns URL for front/back)
      - POST   /test-drives/:id/signature (base64 or upload)
      - GET    /test-drives/calendar?from=&to= (returns events for calendar view)

