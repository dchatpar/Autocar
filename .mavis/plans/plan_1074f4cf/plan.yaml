      - /test-drives/new — 4-step wizard:
        Step 1: Customer + Vehicle (search/create)
        Step 2: Scheduling (date/time/duration/staff/availability check)
        Step 3: Verification (DL upload, insurance, signature)
        Step 4: Details (contact method, special requirements, reminders)
      - /test-drives/calendar — Week view with time-slot grid, drag-to-reschedule

      Use the design system multi-step wizard component pattern (progress bar,
