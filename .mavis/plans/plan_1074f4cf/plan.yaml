      ## Component Design

      /workspace/apps/web/src/components/common/Wizard.tsx

      ```typescript
      interface WizardStep<T> {
        id: string;
        title: string;
        description?: string;
        component: React.ComponentType<WizardStepProps<T>>;
        validate?: (data: T) => Promise<boolean> | boolean;
        optional?: boolean; // user can skip this step
      }

      interface WizardStepProps<T> {
        data: T;
        update: (partial: Partial<T>) => void;
        errors: Record<string, string>;
        isFirstStep: boolean;
        isLastStep: boolean;
      }

      interface WizardProps<T> {
        steps: WizardStep<T>[];
        initialData: T;
        onComplete: (data: T) => Promise<void>;
        onCancel?: () => void;
        storageKey?: string; // for autosave to localStorage
        title: string;
      }
      ```

      Features:
      - Progress indicator (1 of 5)
      - Per-step validation (Zod schema or custom validate function)
      - Back/Next/Skip/Submit buttons
      - Auto-save to localStorage every 30s
      - Restore from localStorage on mount if storageKey provided
      - Warn if leaving with unsaved changes
      - Animated transitions between steps (framer-motion)
      - Mobile-responsive step indicator (collapses to "Step 3 of 5")
