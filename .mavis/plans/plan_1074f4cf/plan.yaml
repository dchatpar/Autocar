      - Sales summary: revenue trend, top salesperson, top vehicle
      - Inventory aging: 0-30, 31-60, 61-90, 90+ days
      - Financial summary: revenue vs expenses, profit margin

      Dark mode design tokens only. WCAG 2.1 AA. Zod validation.


      ## Quality

