  - id: financial-management
    title: Financial Management — Invoices, Expenses, Reports
    prompt: >
      Build the **Financial Management** module from AdaptUs DMS spec Module 7
      — Invoices, Expenses, Reports with export to PDF/Excel.


      ## Database tables (add to schema)

      ```prisma
      model Invoice {
        id              String   @id @default(cuid())
        dealerId        String
        invoiceNumber   String   // INV-YYYYMMDD-#### auto-gen
        customerId      String?
        customerName    String?
        customerEmail   String?
        status          InvoiceStatus @default(DRAFT)
        issuedAt        DateTime @default(now())
        dueAt           DateTime
        subtotal        Decimal  @db.Decimal(10,2)
        taxAmount       Decimal  @db.Decimal(10,2)
        total           Decimal  @db.Decimal(10,2)
        amountPaid      Decimal  @default(0) @db.Decimal(10,2)
        paymentTerms    String   @default("Net 30")
        notes           String?
        sentAt          DateTime?
        paidAt          DateTime?
        createdAt       DateTime @default(now())
        updatedAt       DateTime @updatedAt

        dealer    Dealer    @relation(fields: [dealerId], references: [id], onDelete: Cascade)
        customer  Customer? @relation(fields: [customerId], references: [id])
        items     InvoiceItem[]
        payments  InvoicePayment[]

        @@unique([dealerId, invoiceNumber])
        @@index([dealerId])
        @@index([status])
        @@index([issuedAt])
        @@map("invoices")
      }

      model InvoiceItem {
        id          String   @id @default(cuid())
        invoiceId   String
        description String
        quantity    Int      @default(1)
        unitPrice   Decimal  @db.Decimal(10,2)
        amount      Decimal  @db.Decimal(10,2)
        sortOrder   Int      @default(0)

        invoice Invoice @relation(fields: [invoiceId], references: [id], onDelete: Cascade)
        @@index([invoiceId])
        @@map("invoice_items")
      }

      model InvoicePayment {
        id          String   @id @default(cuid())
        invoiceId   String
        amount      Decimal  @db.Decimal(10,2)
        method      PaymentMethod
        reference   String?  // check #, transaction ID
        paidAt      DateTime @default(now())
        notes       String?

        invoice Invoice @relation(fields: [invoiceId], references: [id], onDelete: Cascade)
        @@index([invoiceId])
        @@map("invoice_payments")
      }

      enum InvoiceStatus { DRAFT, SENT, VIEWED, PARTIAL, PAID, OVERDUE, VOID }
      enum PaymentMethod { CASH, CHECK, CREDIT_CARD, DEBIT, BANK_TRANSFER, STRIPE, OTHER }

      model Expense {
        id           String   @id @default(cuid())
        dealerId     String
        title        String
        category     ExpenseCategory
        amount       Decimal  @db.Decimal(10,2)
        date         DateTime
        vendor       String?
        description  String?
        vehicleId    String?
        receiptUrl   String?
        taxDeductible Boolean @default(true)
        createdById  String?
        createdAt    DateTime @default(now())
        updatedAt    DateTime @updatedAt

        dealer   Dealer   @relation(fields: [dealerId], references: [id], onDelete: Cascade)
        vehicle  Vehicle? @relation(fields: [vehicleId], references: [id])
        createdBy User?   @relation(fields: [createdById], references: [id])

        @@index([dealerId])
        @@index([date])
        @@index([category])
        @@map("expenses")
      }

      enum ExpenseCategory {
        VEHICLE_PURCHASE
        RECONDITIONING
        DETAILING
        REPAIRS
        MARKETING
        OFFICE_SUPPLIES
        UTILITIES
        SALARIES
        RENT
        INSURANCE
        TAXES
        PROFESSIONAL_SERVICES
        MISC
      }
      ```

      Add relations to Dealer, Customer, User, Vehicle.


      ## API Routes

