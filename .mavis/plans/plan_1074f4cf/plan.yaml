  - id: test-drives-module
    title: Test Drive System — 4-step wizard, calendar, before/during/after workflow
    prompt: >
      Build the **Test Drive System** from AdaptUs DMS spec Module 5 — 4-step
      scheduling wizard, calendar view, complete before/during/after workflow
      with checklists and post-test-drive actions.


      ## Database tables (add to schema)

      ```prisma
      model TestDrive {
        id              String   @id @default(cuid())
        dealerId        String
        customerId      String
        vehicleId       String
        leadId          String?
        assignedToId    String?  // staff
        requestedBy     String   // walkin|phone|email|website
        requestedAt     DateTime
        scheduledStart  DateTime
        scheduledEnd    DateTime
        durationMin     Int      @default(60)
        status          TestDriveStatus @default(REQUESTED)
        route           String?  // highway|city|offroad|dealer_lot
        dlNumber        String?
        dlIssued        DateTime?
        dlExpires       DateTime?
        dlFrontUrl      String?
        dlBackUrl       String?
        insuranceVerified Boolean @default(false)
        insuranceProofUrl String?
        signatureUrl    String?
        startOdometer   Int?
        endOdometer     Int?
        distanceKm      Int?     // computed
        interestRating  Int?     // 1-5
        customerComments String?
        staffNotes      String?
        nextStep        NextStepAction?
        completedAt     DateTime?
        createdAt       DateTime @default(now())
        updatedAt       DateTime @updatedAt

        dealer     Dealer     @relation(fields: [dealerId], references: [id], onDelete: Cascade)
        customer   Customer   @relation(fields: [customerId], references: [id])
        vehicle    Vehicle    @relation(fields: [vehicleId], references: [id])
        assignedTo User?      @relation("AssignedTestDrives", fields: [assignedToId], references: [id])
        lead       Lead?      @relation(fields: [leadId], references: [id])

        @@index([dealerId])
        @@index([scheduledStart])
        @@index([status])
        @@index([customerId])
        @@index([vehicleId])
        @@map("test_drives")
      }

      enum TestDriveStatus {
        REQUESTED
        SCHEDULED
        CONFIRMED
        IN_PROGRESS
        COMPLETED
        NO_SHOW
        CANCELLED
      }

      enum NextStepAction {
        SCHEDULE_FOLLOWUP
        SEND_QUOTE
        ANOTHER_TEST_DRIVE
        CONVERT_TO_DEAL
        NO_ACTION
      }
      ```

      Also add `testDrives TestDrive[]` to Customer, Vehicle, User relations.


      ## API Routes

      - GET    /test-drives (filters: from, to, status, vehicle, customer, staff)
