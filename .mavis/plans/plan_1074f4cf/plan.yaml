  - id: lead-scoring-engine
    title: Lead Scoring Engine — rules-based 0-100 score, hot/warm/cold badges
    prompt: >
      Build the **Lead Scoring Engine** from AdaptUs DMS Module 3.5 — rules-based
      scoring with hot/warm/cold classification, real-time score updates on lead
      changes, score history tracking.


      ## Scoring Rules (AdaptUs DMS spec)

      Base: 0

      POSITIVE SIGNALS:
      +20: Has email
      +20: Has phone
      +30: Vehicle from inventory (matched in our vehicles table)
      +10: Budget specified in vehicle_interest
      +15: Contacted <24h after creation
      +25: Responded (sent a message, opened email, attended appointment)
      +20: Scheduled appointment
      +15: Replied to a call/SMS/email
      +10: Source is high-intent (phone, walk-in, click_to_whatsapp)
      +5:  Source is referral or repeat customer

      NEGATIVE SIGNALS:
      -10: No response after 3 attempts (calls, emails, SMS)
      -20: Overdue >7 days (last_contacted_at > 7 days ago)
      -15: Unsubscribed or marked as not interested
      -25: Bad email/phone (bounced, invalid format)
      -10: Lead source is low-quality (cold email list, scraper)
      -5:  Duplicate of existing customer (likely spam)

      CLASSIFICATION:
      0-30:   🔴 Cold
      31-60:  🟡 Warm
      61-100: 🟢 Hot

      Max score capped at 100. Min capped at 0.


      ## Database tables (add to schema)

      ```prisma
      model LeadScore {
        id          String   @id @default(cuid())
        dealerId    String
        leadId      String
        score       Int      // 0-100
        signals     Json     // {hasEmail: 20, hasPhone: 20, ...}
        classification String  // 'cold' | 'warm' | 'hot'
        modelVersion String  @default("rules-v1")
        scoredAt    DateTime @default(now())

        dealer Dealer @relation(fields: [dealerId], references: [id], onDelete: Cascade)
        lead   Lead   @relation(fields: [leadId], references: [id], onDelete: Cascade)

        @@index([dealerId])
        @@index([leadId])
        @@index([scoredAt])
        @@map("lead_scores")
      }
      ```

      Also add `scores LeadScore[]` and `currentScore Int @default(0)` and
      `classification String @default("cold")` to existing Lead model.


      ## API Routes

      - POST   /leads/:id/score (recompute score, save to history, return result)
      - GET    /leads/:id/score/history (last 100 score history rows)
      - GET    /leads?minScore=80 (filter by score threshold — for hot leads)
      - POST   /leads/batch-score (recompute all leads — admin only)
      - GET    /leads/stats/distribution (count of cold/warm/hot leads)


      ## Score Triggers

      The score is recomputed automatically when:
      - Lead created
      - Lead status changes
      - Activity logged (call, email, SMS, appointment, response)
      - Lead fields updated (email, phone, vehicle_interest, budget)
      - Lead marked as lost/not interested
      - 24 hours pass since last score (catch drift)

      Use BullMQ for async score recomputation on every trigger.


      ## Frontend

      - Score badge component at /workspace/apps/web/src/components/leads/ScoreBadge.tsx
        - Renders 0-100 number with color (red<31, yellow 31-60, green>60)
        - Tooltip on hover showing top 3 contributing signals
