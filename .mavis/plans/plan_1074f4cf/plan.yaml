version: 1
plan:
  name: DealerOS Phase 1 — Foundation Build
  max_concurrency: 4
  max_consecutive_failures: 3
  max_cycles: 20
  auto_accept: false
  auto_reject_retries: 1
tasks:
  - id: project-scaffold
    title: Project scaffolding — monorepo, Docker, CI/CD
    prompt: >
      Set up the DealerOS project from scratch in /workspace.


      ## Deliverables


      1. **Monorepo structure** — use Turborepo-style flat structure:
         /workspace
           apps/
             web/          ← Next.js 15 frontend
             api/          ← Node.js + Fastify backend
           packages/
             db/           ← Prisma schema + migrations
             shared/        ← shared TypeScript types/zod schemas
           infra/
             terraform/    ← AWS EKS, RDS, S3, ElastiCache (stub only)
           docker-compose.yml
           package.json    ← root workspace package
           turbo.json
           .env.example

      2. **Docker Compose** for local dev:
         - PostgreSQL 16 (with pgvector extension)
         - Redis 7
         - Next.js 15 dev server (port 3000)
         - Fastify API (port 3001)
         - Hasura Console (port 8080)
         - MinIO (S3 emulation for media uploads)
         Use proper healthchecks and init scripts.

      3. **GitHub Actions CI** — lint → test → build pipeline for web + api.
         Workflow file: .github/workflows/ci.yml
         Run: ESLint, TypeScript type check, Vitest unit tests.

      4. **root package.json** with workspaces: `apps/web`, `apps/api`,
      `packages/*`
         Scripts: `dev`, `build`, `test`, `lint`

      5. **apps/api/package.json** with: fastify, @fastify/cors, @fastify/jwt,
         @fastify/rate-limit, @prisma/client, zod, typescript, vitest, tsx

      6. **apps/web/package.json** with: next@15, react@19, typescript,
         tailwindcss@4, @tailwindcss/vite, shadcn/ui, zustand, @tanstack/react-query,
         recharts, framer-motion, lucide-react, clsx, tailwind-merge

      ## Tech constraints (from spec)

      - Node 22 LTS for API

      - Next.js 15 App Router for web

      - TailwindCSS v4 (CSS-first config)

      - TypeScript strict mode

      - All paths are workspace-absolute or workspace-relative


      ## After scaffolding

      - Write a brief `SETUP.md` at /workspace/SETUP.md explaining how to run
      locally

      - Commit hash or "ready" marker in deliverable.md
    verify_prompt: >
      Verify the monorepo is properly structured:

      1. All package.json files have correct workspace references

      2. docker-compose.yml is valid and services are reachable

      3. CI workflow exists and runs lint + type-check

      4. Run `npm run lint` in both apps/ if deps are installed, or verify
      package scripts are correct

      5. No placeholder README files — real content

      Do not modify any files. Report exact issues found.
    assigned_to: backend-dev
    role: produce
    verified_by: verifier
    depends_on: []
    gates: []
    max_retries: 2
    timeout_ms: 1800000
  - id: database-schema
    title: PostgreSQL schema — full DealerOS multi-tenant schema with RLS
    prompt: >
      Build the complete DealerOS database schema in /workspace/packages/db/


      ## File structure

      /workspace/packages/db/
        schema.prisma          ← Prisma schema (source of truth)
        migrations/             ← SQL migrations (auto-generated by Prisma)
        seed.ts                ← realistic seed data for dev
        README.md              ← schema documentation

      ## Schema requirements (from DealerOS spec Section 6)


      Multi-tenancy: every table has `dealer_id UUID NOT NULL` with RLS.

      Application-level tenant context via `SET app.current_dealer_id = ?`.


      ### Tables to implement (Prisma schema):


      **Auth & Tenants**

      - dealers: id, name, subdomain, plan (starter|growth|pro|enterprise),
      settings (JSON), trial_ends_at, created_at

      - users: id, dealer_id, email, name, role
      (admin|manager|sales|bdc|finance), phone, permissions (JSON), last_login,
      created_at


      **CRM**

      - leads: id, dealer_id, source, status
      (new|contacted|appointment|demo|deal|lost),
        score (0-100), assigned_to (FK users), first_name, last_name, email, phone,
        vehicle_interest (JSON), source_meta (JSON), created_at, updated_at
      - customers: id, dealer_id, first_name, last_name, email, phone,
        address (JSON), dob, credit_tier (A|B|C|D|subprime), dl_number, dl_province,
        notes, tags (String[]), created_at
      - activities: id, dealer_id, entity_type (lead|customer|deal|vehicle),
        entity_id UUID, type (call|email|sms|note|appointment|status_change|ai_action),
        body, metadata (JSON), author_id (FK users, NULL=AI), agent_name, created_at
      - appointments: id, dealer_id, lead_id, customer_id, assigned_to (FK
      users),
        type (sales|test_drive|service|delivery), scheduled_at, duration_min, status,
        notes, created_at
      - communications: id, dealer_id, lead_id, customer_id, channel
      (sms|email|whatsapp|voice),
        direction (inbound|outbound), from_addr, to_addr, subject, body, status,
        external_id, ai_generated, sent_at

      **Inventory**

      - vehicles: id, dealer_id, vin (unique per dealer), make, model, year,
      trim,
        body_style, mileage, exterior_color, interior_color, fuel_type, transmission,
        drivetrain, engine, condition (new|used|certified), status (available|sold|pending|wholesale),
        stock_number, notes, acquired_at, created_at
      - vehicle_pricing: vehicle_id, cost, asking_price, internet_price,
      market_value,
        floor_plan, recon_cost, updated_at
      - vehicle_media: id, vehicle_id, dealer_id, s3_key, cdn_url, type
      (photo|video|360),
        sort_order, ai_score, is_primary, uploaded_at
      - syndication_log: id, vehicle_id, dealer_id, channel
      (autotrader|cargurus|kijiji|facebook),
        status, external_id, last_synced, error_msg, created_at

      **Deals & F&I**

      - deals: id, dealer_id, customer_id, vehicle_id, lead_id, assigned_to (FK
      users),
        status (working|pending_finance|approved|delivered|unwound), deal_type (retail|lease|bhph|wholesale|cash),
        created_at, delivered_at
      - deal_terms: deal_id, sale_price, trade_value, trade_payoff,
      down_payment, tax_amount,
        fee_total, financed_amount, rate, term_months, payment_amount, lender,
        front_gross, back_gross
      - fi_products: id, deal_id, product_type
      (warranty|gap|credit_insurance|tire_wheel|rust),
        provider, cost, selling_price, term_months, deductible
      - documents: id, deal_id, dealer_id, type
      (bill_of_sale|fi_contract|credit_app),
        s3_key, docusign_id, signed_at, signed_by, created_at

      **BHPH**

      - bhph_contracts: id, deal_id, dealer_id, principal, rate, term_months,
      payment_amount,
        payment_day, first_payment, maturity_date, total_payments, status
      - bhph_payments: id, contract_id, dealer_id, due_date, paid_date,
      amount_due,
        amount_paid, principal_portion, interest_portion, balance_after, method, status

      **AI & Analytics**

      - lead_scores: id, lead_id, score, signals (JSON), model_version,
      scored_at

      - agent_runs: id, dealer_id, agent_name, entity_type, entity_id UUID,
        input (JSON), output (JSON), tokens_in, tokens_out, cost_usd, duration_ms,
        status, created_at
      - embeddings: id, dealer_id, entity_type, entity_id UUID, vector
      (Unsupported("vector(1536)")),
        model, created_at  ← pgvector, note as Unsupported

      ## RLS Strategy (PostgreSQL)

      Include a README section explaining the RLS approach:

      - All tables have dealer_id + customer_id foreign keys

      - Prisma middleware to auto-set dealer_id on every query using SET
      app.current_dealer_id

      - For MVP: application-level filtering (dealer_id WHERE clause on every
      query)

      - Note: production RLS policies documented but implemented as app-level
      for Phase 1


      ## Seed data

      Create realistic seed data: 2 dealers, 5 users each, 20 leads, 10
      customers,

      15 vehicles in inventory, 3 active deals. Use faker-style realistic data.


      ## Prisma config

      - Use PostgreSQL 16 provider

      - Enable preview features: fullTextIndex, fullTextSearch

      - Add @@index on dealer_id, foreign keys

      - Add @@unique on [dealer_id, vin] for vehicles


      ## Verify

      Run `npx prisma validate` to confirm schema is valid.

      Run `npx prisma generate` to confirm client builds.
    verify_prompt: |
      Verify the database schema:
      1. Run `npx prisma validate` — schema must be valid
      2. Run `npx prisma generate` — client must be generated without errors
      3. Confirm all tables from the spec are present with correct field types
      4. Confirm multi-tenancy: every table has dealer_id
      5. Confirm vehicle @@unique([dealer_id, vin]) constraint
      6. Confirm seed.ts has realistic data (2+ dealers, 10+ leads, 5+ vehicles)
      Do not modify files. Report exact issues.
    assigned_to: backend-dev
    role: produce
    verified_by: verifier
    depends_on:
      - project-scaffold
    gates: []
    max_retries: 2
    timeout_ms: 1800000
  - id: api-auth
    title: Auth system — JWT, multi-tenant middleware, RBAC, dealer onboarding
    prompt: >
      Build the authentication and authorization layer for the DealerOS API.


      ## Files to create in /workspace/apps/api/


      ### src/plugins/auth.ts

      - Fastify JWT plugin using @fastify/jwt

      - JWT secret from env: AUTH_JWT_SECRET (default to dev secret for local)

      - Access token: { userId, dealerId, role } — 15 min expiry

      - Refresh token: { userId } — 7 day expiry

      - Decorate fastify instance with `authenticate()` and `authorize(roles[])`


      ### src/plugins/tenant.ts

      - Tenant context middleware: extract dealer_id from JWT, set in request
      scope

      - All routes must be tenant-scoped (every query filters by dealer_id)

      - Prisma middleware to auto-inject dealer_id: `prisma.$use` hook that sets
        `WHERE dealer_id = ?` on every query

      ### src/routes/auth.ts

      POST /auth/register        ← create dealer + first admin user

      POST /auth/login           ← email + password → JWT

      POST /auth/refresh         ← refresh token → new access token

      POST /auth/logout          ← invalidate refresh token (Redis blocklist)

      GET  /auth/me              ← current user profile

      POST /auth/invite          ← invite user by email (creates pending user)

      POST /auth/accept-invite   ← set password for invited user


      ### src/routes/users.ts

      GET    /users              ← list users for current dealer

      GET    /users/:id          ← get user

      PUT    /users/:id          ← update name, role, phone

      DELETE /users/:id          ← deactivate user (soft)


      ### src/routes/dealer.ts

      GET  /dealer               ← current dealer profile

      PUT  /dealer               ← update name, subdomain, settings


      ## RBAC Matrix (from spec)

      Role permissions:

      - admin:  full access

      - manager: read/write all, cannot delete users or change billing

      - sales:  read/write leads, customers, deals; read inventory

      - bdc:    read/write leads; read customers; read inventory

      - finance: read/write deals, customers; read leads, inventory


      ## Implementation notes

      - Password hashing: bcrypt (cost 12)

      - Use Prisma for DB operations in /workspace/packages/db/

      - Zod validation for all request bodies

      - Return proper HTTP status codes: 400 (validation), 401 (unauth), 403
      (forbidden), 404

      - All routes except /auth/login and /auth/register require valid JWT


      ## Error response shape

      { error: string, code?: string, details?: any }


      ## Verify

      - All routes return 401 without valid JWT (except login/register)

      - Tenant isolation: user from Dealer A cannot see Dealer B's data

      - Run `npm run dev` in apps/api and test with curl:
        1. Register a dealer + admin user
        2. Login → get JWT
        3. Use JWT to call GET /users → should return users for that dealer only
        4. Create a second dealer + user, verify they only see their own users
    verify_prompt: |
      Verify auth implementation:
      1. Check all routes are protected (require JWT) except auth login/register
      2. Verify tenant isolation: queries filter by dealer_id from JWT
      3. Verify RBAC: sales role cannot access user deletion
      4. Verify JWT validation: expired tokens return 401
      5. Verify refresh token flow works end-to-end
      6. Run the API and test with curl as described in the prompt
      Do not modify files. Report exact issues.
    assigned_to: backend-dev
    role: produce
    verified_by: verifier
    depends_on:
      - database-schema
    gates: []
    max_retries: 2
    timeout_ms: 1800000
  - id: api-crm
    title: CRM API — leads, customers, activities, appointments, pipeline
    prompt: >
      Build the full CRM API layer in /workspace/apps/api/src/routes/


      ## Routes to implement


      ### leads.ts

      GET    /leads              ← list with
      ?status=&source=&search=&assigned_to=
                                     Returns: id, first_name, last_name, email, phone,
                                     source, status, score, assigned_to (with user name),
                                     vehicle_interest, created_at — paginated (cursor)
      POST   /leads              ← create lead (first_name, last_name, email,
      phone,
                                     source, vehicle_interest JSON)
      GET    /leads/:id          ← full lead detail with activities feed

      PUT    /leads/:id          ← update any field including status change

      DELETE /leads/:id          ← soft delete (archive flag)

      POST   /leads/:id/assign   ← assign to user (assigned_to FK)

      POST   /leads/:id/note     ← add activity note (type: note)

      POST   /leads/:id/call     ← log outbound call activity

      PUT    /leads/:id/score    ← update AI score


      Lead status flow: new → contacted → appointment → demo → deal → closed_won
                                              ↘ lost

      On status change → create activities entry automatically.


      ### customers.ts

      GET    /customers          ← list with ?search=&credit_tier=

      POST   /customers          ← create

      GET    /customers/:id      ← full 360 page: customer + activities + deals
      + vehicles

      PUT    /customers/:id      ← update

      DELETE /customers/:id      ← soft delete


      ### activities.ts

      GET    /activities         ← ?entity_type=&entity_id=&type=&limit=50

      POST   /activities         ← create manually


      ### appointments.ts

      GET    /appointments       ← ?from=&to=&assigned_to=

      POST   /appointments       ← create (lead_id|customer_id, type,
      scheduled_at, duration_min)

      PUT    /appointments/:id   ← update status
      (scheduled|confirmed|completed|noshow|cancelled)

      DELETE /appointments/:id   ← cancel


      ### pipeline.ts

      GET    /pipeline           ← Kanban board data: deals grouped by stage
                                     Returns: { stages: { new_leads: [], contacted: [],
                                     test_drive: [], negotiating: [], closed_won: [], closed_lost: [] } }
      POST   /pipeline/deals     ← create deal from lead (customer_id,
      vehicle_id, lead_id, stage)

      PUT    /pipeline/deals/:id  ← update stage (on stage change → activity log
      entry)

      GET    /pipeline/deals/:id  ← deal detail with terms + F&I products


      ## Common patterns

      - All list endpoints: cursor pagination (lastId + limit=20 default)

      - All responses: { data: [...], pagination: { hasMore, cursor } }

      - tenant middleware applied to all routes

      - Zod validation on all POST/PUT bodies

      - Include created_at, updated_at on all responses


      ## Verify

      - Run API and test CRUD for leads, customers

      - Verify cursor pagination works (limit=5, paginate through results)

      - Verify status change on lead creates activity entry

      - Verify pipeline Kanban returns correctly grouped data
    verify_prompt: |
      Verify CRM API:
      1. Start the API server
      2. Create a lead → verify it appears in GET /leads
      3. Update lead status → verify activity entry created
      4. Create customer → verify GET /customers/:id returns 360 data
      5. Test pagination: create 25 leads, paginate with limit=10
      6. Test pipeline: create deals in different stages, verify Kanban grouping
      7. Verify tenant isolation: data from dealer A not visible to dealer B
      Do not modify files. Report exact issues with test commands and outputs.
    assigned_to: backend-dev
    role: produce
    verified_by: verifier
    depends_on:
      - api-auth
    gates: []
    max_retries: 2
    timeout_ms: 1800000
  - id: api-inventory
    title: Inventory API — vehicles, pricing, media, syndication
    prompt: >
      Build the Inventory API layer in /workspace/apps/api/src/routes/


      ## Routes to implement


      ### vehicles.ts

      GET    /inventory          ← list with ?status=&make=&search=&page=&limit=
                                     Returns: id, vin, make, model, year, status,
                                     mileage, exterior_color, internet_price,
                                     days_on_lot, primary_photo_url, syndication_status
      POST   /inventory          ← create vehicle (vin auto-decoded via NHTSA
      VPIC)
                                     Fields: make, model, year, vin, mileage, color,
                                     condition, status=available, stock_number auto-gen
      GET    /inventory/:id      ← full vehicle detail with photos, pricing,
      syndication

      PUT    /inventory/:id      ← update any field

      DELETE /inventory/:id      ← soft delete (status=sold, or hard delete if
      no deals)


      ### pricing.ts

      GET    /inventory/:id/pricing    ← get vehicle pricing

      PUT    /inventory/:id/pricing    ← update pricing (cost, asking, internet,
      market, floor)


      ### media.ts

      GET    /inventory/:id/media       ← list photos

      POST   /inventory/:id/media      ← add media (s3_key, cdn_url, type,
      sort_order, is_primary)

      PUT    /media/:id                ← update (sort_order, is_primary)

      DELETE /media/:id                ← remove


      ### syndication.ts

      GET    /inventory/:id/syndication ← syndication status per channel

      POST   /inventory/:id/syndication ← trigger sync to channel
      (autotrader|cargurus|kijiji|facebook)

      GET    /syndication/logs         ← recent syndication log entries


      ## VIN Decode (NHTSA VPIC)

      On POST /inventory: if vin provided, call NHTSA VPIC API:

      GET https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVin/{vin}?format=json

      Extract: Make, Model, Year, Body Type, Engine, Fuel Type, Transmission

      Auto-fill those fields in the vehicle record.


      ## Stock number generation

      Pattern: {DEALER_PREFIX}-{YYYY}{MM}{SEQ}

      e.g., "ABC-202506001" — auto-increment per dealer per month.


      ## Verify

      - Create vehicle with VIN → auto-decode fills make/model/year

      - Upload photos → primary photo shows in vehicle card

      - Update pricing → internet_price reflected in list view

      - Mark vehicle sold → status=sold, days_on_lot frozen
    verify_prompt: >
      Verify Inventory API:

      1. Create a vehicle with a real VIN (e.g., 1HGCM82633A004352) → verify
      NHTSA decode fills fields

      2. Add multiple photos → verify primary photo flag works

      3. Update pricing → verify pricing fields stored correctly

      4. Mark vehicle sold → verify status transition

      5. Test search: create 20 vehicles, search by make/model/vin

      6. Verify syndication log entry created on sync trigger

      Do not modify files. Report exact issues.
    assigned_to: backend-dev
    role: produce
    verified_by: verifier
    depends_on:
      - api-auth
    gates: []
    max_retries: 2
    timeout_ms: 1800000
  - id: design-system
    title: Design system — TailwindCSS v4 tokens, shadcn/ui components, dark mode
    prompt: >
      Build the DealerOS design system in /workspace/apps/web/


      ## Color Tokens (from DealerOS spec Section 14 — dark mode first)

      CSS variables to define in globals.css:


      --color-bg-primary:    #0A0C0F   /* page background */

      --color-bg-card:      #111318   /* card/panel background */

      --color-bg-elevated:  #1A1D24   /* dropdown/popover */

      --color-border:       #1E2229   /* all borders */

      --color-border-active:#2A2F3A   /* hover/focus borders */

      --color-text-primary: #E2E8F0   /* body text */

      --color-text-muted:   #6B7280   /* labels, captions */

      --color-accent:       #E8FF47   /* primary CTA, badges */

      --color-success:      #22D3A0   /* active, confirmed, positive */

      --color-info:         #3B82F6   /* links, info, syndication */

      --color-warning:      #F97316   /* aged inventory, late payments */

      --color-danger:       #EF4444   /* errors, delinquent, lost */

      --color-ai:           #A855F7   /* AI agent indicators */


      ## TailwindCSS v4 setup

      In /workspace/apps/web/tailwind.config.ts:

      - Use CSS-first config (no tailwind.config.js, use @theme in CSS)

      - Map CSS variables to Tailwind tokens: bg-primary, bg-card, bg-elevated,
        border-default, text-primary, text-muted, accent, success, info, warning, danger, ai
      - Font family: DM Sans for body, JetBrains Mono for VIN/codes

      - Custom utilities for card, btn variants, badge variants, sidebar-item,
      input, etc.


      ## Core Components (shadcn/ui style — use their primitives)


      Build these components in /workspace/apps/web/src/components/ui/:


      1. **Button** — variants: primary (accent yellow), secondary, ghost,
      danger, success
         Sizes: sm, md, lg. States: default, hover, active (scale-[0.98]), disabled, loading

      2. **Input** — with label, error state, helper text. Dark bg (#1A1D24),
      rounded-lg


      3. **Card** — hover elevation effect, border glow on hover


      4. **Badge** — variants for each status: blue (info), orange (warning),
      green (success),
         red (danger), yellow (accent), purple (AI), gray (muted)

      5. **Modal/Dialog** — backdrop blur, slide-in animation, close on escape


      6. **Select** — custom styled dark select with Radix primitives


      7. **Tabs** — underline style, active state with accent color


      8. **Table** — hover row highlight, sticky header, responsive collapse


      9. **Avatar** — initials fallback, status dot (online/away/offline)


      10. **Dropdown Menu** — Radix-based, dark theme, with icons


      11. **Command Palette** — ⌘K style, dark overlay, fuzzy search across
      leads/vehicles/customers


      12. **Skeleton** — animated pulse for loading states


      ## Layout Shell

      /workspace/apps/web/src/app/layout.tsx:

      - Sidebar (64px collapsed, 240px expanded) — logo, nav items with icons

      - Top bar: search, notifications bell, user avatar + dropdown

      - Main content area with proper padding

      - Mobile: hamburger menu


      ## Navigation items (from spec):

      Dashboard, Leads, Customers, Inventory, Pipeline, Deals, BHPH, Campaigns,

      Analytics, AI Agents, Settings


      ## Fonts

      Use Google Fonts: DM Sans (400, 500, 700, 800) and JetBrains Mono (400,
      500)


      ## Global CSS

      /workspace/apps/web/src/app/globals.css:

      - CSS reset + base styles

      - Custom scrollbar styling (dark)

      - Text selection color

      - Smooth scrolling

      - Focus ring styles

      - Loading spinner animation


      ## Verify

      - All components render without console errors

      - Dark mode is default (no white flashes)

      - Responsive at 1280px (desktop) and 768px (tablet)

      - ⌘K command palette opens with keyboard shortcut
    verify_prompt: |
      Verify design system:
      1. Start Next.js dev server
      2. Verify all 12 components render correctly in Storybook or test page
      3. Check dark mode: no white backgrounds anywhere
      4. Verify responsive: sidebar collapses at tablet width
      5. Check ⌘K command palette opens
      6. Verify font loading: DM Sans + JetBrains Mono applied
      7. Run lighthouse or check visual output for color tokens
      Do not modify files. Report exact issues.
    assigned_to: backend-dev
    role: produce
    verified_by: verifier
    depends_on:
      - project-scaffold
    gates: []
    max_retries: 2
    timeout_ms: 1800000
  - id: frontend-pages
    title: Frontend pages — dashboard, lead pipeline, inventory manager, customer 360
    prompt: >
      Build the core DealerOS frontend pages in /workspace/apps/web/src/app/


      ## Pages to build


      ### 1. Dashboard (app/page.tsx — main entry)

      KPI cards row:

      - Total Leads (with new today count)

      - Active Deals (pipeline value)

      - Vehicles in Stock

      - Revenue MTD

      Each card: large number, trend arrow, subtitle. Card backgrounds with
      subtle color glow.


      Live Activity Feed: recent leads, appointments, deal stage changes
      (WebSocket ready stub)


      Quick Actions: Add Lead, Add Vehicle, Schedule Appointment


      Aged Inventory Alert: vehicles 30+ days unsold


      Lead Source Chart: bar chart showing leads by source (Recharts)


      ## 2. Lead Pipeline (app/leads/page.tsx)

      Kanban board:

      Columns: New Leads | Contacted | Test Drive | Negotiating | Closed Won |
      Lost


      Lead cards show: name, phone, source badge, score badge (color: red<40,
      yellow40-70, green>70),

      vehicle interest, assigned rep avatar, time in stage


      Drag-and-drop between columns (use @dnd-kit/core)


      Toggle: Kanban view ↔ Table view


      Filter bar: source, status, assigned_to, date range


      Quick actions on card hover: Call, SMS, Email, Note, Assign


      ## 3. Inventory Manager (app/inventory/page.tsx)

      Grid/List toggle:

      Grid: vehicle photo cards (primary photo), make/model/year, price badge,

      status indicator, days on lot, syndication dots


      List: table with sortable columns


      Search bar: search by VIN, make, model, stock number


      Filters: status, make, price range


