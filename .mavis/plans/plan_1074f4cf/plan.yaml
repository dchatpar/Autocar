  - id: activity-logs-audit
    title: Activity Logs & Audit Trail — full user/system action history
    prompt: >
      Build the **Activity Logs & Audit Trail** from AdaptUs DMS Module 10.2
      — comprehensive audit log of every user action and system event with
      filterable timeline, IP tracking, and IP-based anomaly detection.


      ## Database tables (add to schema)

      ```prisma
      model ActivityLog {
        id          String   @id @default(cuid())
        dealerId    String
        userId      String?
        action      String   // e.g. 'lead.created', 'customer.updated', 'vehicle.deleted'
        entityType  String   // 'lead' | 'customer' | 'vehicle' | 'deal' | 'user' | 'invoice' | etc
        entityId    String?
        before      Json?    // snapshot of entity before change
        after       Json?    // snapshot after change
        diff        Json?    // { changed: [{field, before, after}], added: [...], removed: [...] }
        ipAddress   String?
        userAgent   String?
        metadata    Json?    // additional context (requestId, batchId, etc)
        createdAt   DateTime @default(now())

        dealer Dealer @relation(fields: [dealerId], references: [id], onDelete: Cascade)
        user   User?  @relation(fields: [userId], references: [id])

        @@index([dealerId])
        @@index([userId])
        @@index([action])
        @@index([entityType, entityId])
        @@index([createdAt])
        @@map("activity_logs")
      }
      ```

      ## Auto-Logging

      Create a service that automatically logs every mutation:

      - Prisma extension that intercepts create/update/delete
      - For each mutation, computes before/after diff
      - Writes ActivityLog row in same transaction
      - Captures userId from request context
      - Captures IP + user-agent from request

      Implementation: a `withAuditContext(prisma, { userId, ip, userAgent })`
      wrapper that returns a Prisma client which logs mutations.

      Use this wrapper in EVERY service that mutates data:
      - lead.service, customer.service, vehicle.service, deal.service, etc.


      ## API Routes

      - GET    /activity-logs (filters: userId, action, entityType, entityId, from, to)
      - GET    /activity-logs/:id (full log with diff)
      - GET    /activity-logs/stats (count by action type, by user, by day)
      - GET    /activity-logs/anomalies (suspicious: logins from new IPs, bulk deletes,
              off-hours activity, permission escalations)
      - GET    /entities/:type/:id/trail (timeline of all changes to this entity)
      - POST   /activity-logs/export (CSV download of logs for compliance audit)


      ## What gets logged (MUST be exhaustive)

      Auth: user.login, user.login_failed, user.logout, user.password_reset,
            user.invited, user.role_changed
      Leads: lead.created, lead.updated, lead.assigned, lead.status_changed,
             lead.deleted, lead.score_updated, lead.routed
      Customers: customer.created, customer.updated, customer.merged, customer.deleted
      Vehicles: vehicle.created, vehicle.updated, vehicle.deleted, vehicle.price_changed,
                vehicle.status_changed, vehicle.media_uploaded
      Deals: deal.created, deal.stage_changed, deal.delivered, deal.cancelled
      Inventory: inventory.synced, inventory.syndication_failed
      Finance: invoice.created, invoice.sent, invoice.paid, expense.created
      Settings: settings.updated, user.invited, role.changed, integration.connected,
                integration.disconnected
      AI: agent.run_started, agent.run_completed, agent.run_failed, agent.toggled


      ## Frontend

      - /workspace/apps/web/src/app/settings/activity-logs/page.tsx
        - Full timeline view with filters
        - User avatar, action chip, entity link, timestamp
        - Click row → expand to show before/after diff
        - Export button
        - Anomalies tab (red badges for suspicious activity)
      - /workspace/apps/web/src/components/activity/ActivityTimeline.tsx
      - /workspace/apps/web/src/components/activity/DiffViewer.tsx
        - Side-by-side before/after JSON
        - Highlighted changed fields
      - /workspace/apps/web/src/hooks/useActivityLogs.ts
      - Update user dropdowns and entity tables to show "last activity" column


      ## Anomaly Detection (basic)

      Flag these patterns:
      - Login from new IP (IP not seen for this user in last 30 days)
      - Bulk deletes (>10 records in 1 minute)
      - Off-hours activity (between 10pm and 6am local time)
      - Permission escalation (user role changed to admin)
      - Failed login attempts (>5 in 10 minutes)
      - Large data export (>1000 records)

      Store anomalies in a separate field: ActivityLog.metadata.anomaly = true


      ## Quality

      - TypeScript strict
      - Use Prisma middleware/extension for auto-logging
      - Don't log sensitive data: passwords, JWT secrets, full credit card numbers
      - Auto-purge logs >2 years (BullMQ scheduled job)
      - Multi-tenant
      - WCAG 2.1 AA, dark mode

      Write deliverable.md at
      /workspace/.mavis/plans/plan_1074f4cf/outputs/activity-logs-audit/deliverable.md
      ending with `## VERDICT: PASS`.
    verify_prompt: |
