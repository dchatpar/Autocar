  - id: duplicate-detection-module
    title: Duplicate Detection & Merge — fuzzy match on name+phone+email
    prompt: >
      Build the **Duplicate Detection & Merge** system for Customer and Lead
      records. Read skill at /workspace/.skills/duplicate-detection/SKILL.md.


      ## Implementation

      Multi-field weighted matching with these weights:
      - Email: 0.35 (exact match)
      - Phone: 0.30 (E.164 match or last-7-digits)
      - First name: 0.15 (Jaro-Winkler >0.85)
      - Last name: 0.15 (Jaro-Winkler >0.85)
      - Address: 0.05 (postal code + street number)

      Thresholds:
      - ≥0.90: AUTO_MERGE_CANDIDATE (badge with merge button)
      - ≥0.65: FLAG_FOR_REVIEW (badge with side-by-side compare)
      - <0.65: not duplicate

      ## Database tables (add to schema)

      ```prisma
      model DuplicateDetectionLog {
        id          String   @id @default(cuid())
        dealerId    String
        entityType  String   // 'customer' | 'lead'
        entityAId   String
        entityBId   String
        score       Float
        reasons     Json     // ['email match', 'phone last-7 match', ...]
        classification String // 'auto_merge' | 'flag' | 'not_duplicate'
        status      String   @default("pending") // pending | merged | dismissed
        mergedAt    DateTime?
        mergedById  String?
        createdAt   DateTime @default(now())

        dealer Dealer @relation(fields: [dealerId], references: [id], onDelete: Cascade)

        @@index([dealerId])
        @@index([entityType])
        @@index([status])
        @@map("duplicate_detection_log")
      }

      model CustomerMergeRecord {
        id              String   @id @default(cuid())
        dealerId        String
        masterId        String   // the kept customer
        duplicateId     String   // the removed customer
        fieldChoices    Json     // { firstName: 'master'|'duplicate', email: ..., ... }
        mergedById      String
        mergedAt        DateTime @default(now())
        unmergedAt      DateTime?
        unmergedById    String?
        recoverable     Boolean  @default(true)

        dealer     Dealer   @relation(fields: [dealerId], references: [id], onDelete: Cascade)
        master     Customer @relation("MergeMaster", fields: [masterId], references: [id])
        duplicate  Customer @relation("MergeDuplicate", fields: [duplicateId], references: [id])
        mergedBy   User     @relation(fields: [mergedById], references: [id])

        @@index([dealerId])
        @@index([masterId])
        @@index([duplicateId])
        @@map("customer_merge_records")
      }
      ```

      Also add to Customer model: `mergedIntoId String?`, `deletedAt DateTime?`,
      `mergeMasterRecords CustomerMergeRecord[] @relation("MergeMaster")`,
      `mergeDuplicateRecords CustomerMergeRecord[] @relation("MergeDuplicate")`.


      ## API Routes

      - POST   /customers/:id/find-duplicates (returns top 10 matches with score)
      - POST   /customers/merge (body: { masterId, duplicateId, fieldChoices })
      - POST   /customers/merge/preview (returns what would happen, no changes)
      - POST   /customers/merge/:recordId/unmerge (within 30 days)
      - GET    /customers/duplicates (list all pending duplicate detection rows for review)
      - POST   /customers/:id/dismiss-duplicate/:otherId

      Also:
      - POST   /leads/:id/find-duplicates (same logic, but for leads → customers)
      - When a lead is converted to customer, run duplicate check

      Auto-trigger on customer create + lead ingest.


      ## Frontend

      - /workspace/apps/web/src/app/customers/duplicates/page.tsx
        - List all detected duplicate pairs
        - Side-by-side compare view with field picker
        - Merge / Dismiss buttons
        - Filter by classification (auto_merge / flag)
      - /workspace/apps/web/src/components/customers/DuplicateCompare.tsx
        - Two-column layout, each field has radio to pick master/duplicate value
        - Preview button shows what merged record will look like
        - Confirm button executes merge with fieldChoices
      - /workspace/apps/web/src/components/customers/DuplicateBadge.tsx
        - On customer list rows, show badge if duplicate detected
        - Tooltip explains the match
        - Click → opens compare modal
      - /workspace/apps/web/src/hooks/useDuplicateDetection.ts


      ## Merge Logic

      In a transaction:
      1. Move all related records from duplicate to master:
         - deal.customerId, lead.customerId, appointment.customerId, testDrive.customerId,
           invoice.customerId, activity.entityId (if entityType=customer)
      2. Update master with chosen field values
      3. Log merge in CustomerMergeRecord
      4. Soft-delete duplicate (deletedAt = now, mergedIntoId = masterId)
      5. Move duplicate_detection_log rows to status=merged

      Recovery: within 30 days, unmerge reverts all moves and restores duplicate.


      ## Quality

      - TypeScript strict
      - Add deps: fastest-levenshtein, jaro-winkler, libphonenumber-js
      - Database indexes on (dealer_id, email), (dealer_id, phone)
      - Test with 1000 fake customers, verify perf <500ms per find-duplicates call
      - Multi-tenant: every query filters dealerId
      - WCAG 2.1 AA, dark mode

      Write deliverable.md at
      /workspace/.mavis/plans/plan_1074f4cf/outputs/duplicate-detection-module/deliverable.md
      ending with `## VERDICT: PASS`.
