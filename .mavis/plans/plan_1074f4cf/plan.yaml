      - PUT    /purchases/:id
      - DELETE /purchases/:id (admin only)
      - POST   /purchases/:id/print-pdf (generate bill of sale PDF)

      Database table:
      ```prisma
      model VehiclePurchase {
        id            String   @id @default(cuid())
        dealerId      String
        vehicleId     String?
        purchaseDate  DateTime
        purchasePrice Decimal  @db.Decimal(10,2)
        source        PurchaseSource // walkin|phone|online|auction
        sellerType    SellerType     // individual|company
        sellerName    String
        sellerPhone   String?
        sellerEmail   String?
        sellerAddress Json?
        documents     Json?    // [{type, s3Key, uploadedAt}]
        notes         String?
        acceptedById  String?
        checklist     Json?    // {inspectionComplete, reconditioningNeeded, photosTaken, listed}
        status        PurchaseStatus @default(DRAFT)
        createdAt     DateTime @default(now())
        updatedAt     DateTime @updatedAt

        dealer     Dealer   @relation(fields: [dealerId], references: [id], onDelete: Cascade)
        vehicle    Vehicle? @relation(fields: [vehicleId], references: [id])
        acceptedBy User?    @relation(fields: [acceptedById], references: [id])

        @@index([dealerId])
        @@index([purchaseDate])
        @@map("vehicle_purchases")
      }

      enum PurchaseSource { WALKIN, PHONE, ONLINE, AUCTION, TRADE_IN, OTHER }
      enum SellerType { INDIVIDUAL, COMPANY, DEALER, AUCTION }
      enum PurchaseStatus { DRAFT, PENDING, COMPLETED, CANCELLED }
