  - id: marketing-campaigns
    title: Marketing Campaigns — drip sequences, lead nurturing, email/SMS workflows
    prompt: >
      Build the **Marketing Campaigns** module — drip sequences, lead
      nurturing, and automated workflows. DealerOS spec calls this the
      "campaigns" nav item.

      ## Database tables (add to schema)

      ```prisma
      model Campaign {
        id              String   @id @default(cuid())
        dealerId        String
        name            String
        description     String?
        type            CampaignType
        status          CampaignStatus @default(DRAFT)
        trigger         CampaignTrigger
        steps           Json     // [{delay: '1d', channel: 'email'|'sms'|'wait', template: '...', subject?: '...'}]
        targetAudience  Json?    // {source: 'meta_lead_ad'|'webhook'|..., status: 'new', score: '>=60'}
        enrolledCount   Int      @default(0)
        completedCount  Int      @default(0)
        startedAt       DateTime?
        endedAt         DateTime?
        createdAt       DateTime @default(now())
        updatedAt       DateTime @updatedAt

        dealer    Dealer           @relation(fields: [dealerId], references: [id], onDelete: Cascade)
        enrollments CampaignEnrollment[]

        @@index([dealerId])
        @@index([status])
        @@map("campaigns")
      }

      enum CampaignType { NURTURE, REACTIVATION, BIRTHDAY, APPOINTMENT_REMINDER, REVIEW_REQUEST, CUSTOM }
      enum CampaignStatus { DRAFT, ACTIVE, PAUSED, COMPLETED, ARCHIVED }
      enum CampaignTrigger {
        LEAD_CREATED
        LEAD_STATUS_CHANGED
        APPOINTMENT_BOOKED
        TEST_DRIVE_COMPLETED
        DEAL_DELIVERED
        INACTIVITY_30D
        INACTIVITY_60D
        INACTIVITY_90D
        BIRTHDAY
        MANUAL_ENROLL
      }

      model CampaignEnrollment {
        id            String   @id @default(cuid())
        campaignId    String
        leadId        String?
        customerId    String?
        currentStep   Int      @default(0)
        status        EnrollmentStatus @default(ACTIVE)
        nextRunAt     DateTime?
        completedAt   DateTime?
        unenrolledAt  DateTime?
        unenrollReason String?
        createdAt     DateTime @default(now())
        updatedAt     DateTime @updatedAt

        campaign Campaign  @relation(fields: [campaignId], references: [id], onDelete: Cascade)
        lead     Lead?     @relation(fields: [leadId], references: [id])
        customer Customer? @relation(fields: [customerId], references: [id])

        @@index([campaignId])
        @@index([status, nextRunAt])
        @@map("campaign_enrollments")
      }

      enum EnrollmentStatus { ACTIVE, PAUSED, COMPLETED, UNENROLLED, FAILED }
      ```

      ## API Routes

      - GET    /campaigns (list, with status filter)
      - POST   /campaigns (create with steps)
      - GET    /campaigns/:id (with steps + enrollments)
      - PUT    /campaigns/:id
      - DELETE /campaigns/:id
      - POST   /campaigns/:id/activate (start)
      - POST   /campaigns/:id/pause
      - POST   /campaigns/:id/enroll (manually enroll lead/customer)
      - GET    /campaigns/:id/enrollments (list with status)
      - POST   /campaigns/enrollments/:id/unenroll

      ## Trigger System (BullMQ)

      On every event (lead:created, deal:delivered, etc.):
      - Match active campaigns with that trigger
      - Enroll lead/customer
      - Schedule first step (delay 0 or as defined)
      - BullMQ processes nextRunAt steps

      ## Frontend

      - /workspace/apps/web/src/app/campaigns/page.tsx (list with stats)
      - /workspace/apps/web/src/app/campaigns/new/page.tsx (5-step wizard: Name, Trigger, Audience, Steps, Review)
      - /workspace/apps/web/src/app/campaigns/[id]/page.tsx (detail with steps + enrollments)
      - /workspace/apps/web/src/app/campaigns/[id]/edit/page.tsx
      - /workspace/apps/web/src/components/campaigns/CampaignCard.tsx
      - /workspace/apps/web/src/components/campaigns/StepEditor.tsx
      - /workspace/apps/web/src/components/campaigns/EnrollmentTable.tsx
      - /workspace/apps/web/src/components/campaigns/StatsOverview.tsx
      - /workspace/apps/web/src/hooks/useCampaigns.ts

      Email/SMS templates: use the existing email/sms providers from social-media-integration.

      Write deliverable.md ending `## VERDICT: PASS`.
    verify_prompt: |
      Verify marketing campaigns:
      1. Schema has Campaign, CampaignEnrollment tables
      2. prisma validate passes
      3. pnpm typecheck passes
      4. Test: create campaign with 3 steps (email, wait 2d, sms)
      5. Test: trigger fires, lead enrolled, first step scheduled
      6. Test: BullMQ worker processes step, sends email
      7. Test: unenroll mid-sequence stops further steps
      8. Frontend /campaigns lists with enrollment count
      9. Frontend /campaigns/new 5-step wizard
    assigned_to: backend-dev
    role: produce
    verified_by: verifier
    depends_on:
      - api-crm
      - social-media-integration
    gates: []
    max_retries: 2
    timeout_ms: 1800000
  - id: mobile-app-shell
    title: Mobile App Shell — React Native scaffold with VIN/DL scanner
    prompt: >
      Build the **Mobile App Shell** — React Native + Expo app for iOS +
      Android. This is the foundation for the Phase 3 mobile feature. For
      now, ship a working app shell with: auth, dashboard, VIN scanner
      camera view, DL scanner camera view, lead inbox.

      ## Setup

      /workspace/apps/mobile/ — React Native + Expo SDK 52
      - expo-router for file-based routing
      - @tanstack/react-query for server state
      - zustand for UI state
      - vision-camera for VIN/DL scanning
      - MMKV for offline cache
      - reanimated for animations

      ## Screens

      - /(auth)/login.tsx — login (calls existing /auth/login API)
      - /(app)/_layout.tsx — bottom tab navigator
      - /(app)/index.tsx — dashboard with KPIs
      - /(app)/leads/index.tsx — lead inbox
      - /(app)/leads/[id].tsx — lead detail
      - /(app)/inventory/index.tsx — vehicle grid
      - /(app)/inventory/add.tsx — VIN scanner (camera → NHTSA decode → form)
      - /(app)/customers/add.tsx — DL scanner (camera → OCR → form prefill)
      - /(app)/settings.tsx

      ## VIN Scanner (in apps/mobile/app/(app)/inventory/add.tsx)

      Use vision-camera + a VIN detection library (or simple barcode reader).
      On capture:
      - Send to /inventory with VIN
      - Backend decodes via NHTSA
      - Auto-fill year/make/model/trim
      - User confirms/edits remaining fields
      - Save

      ## DL Scanner (in apps/mobile/app/(app)/customers/add.tsx)

      Use vision-camera + AWS Textract (or mock).
      On capture:
      - Send image to /customers/scan-dl (backend)
      - Backend calls Textract, returns parsed fields
      - Pre-fill form: name, DOB, license number, address
      - User confirms
      - Save

      ## Build & Run

      - eas.json configured for iOS + Android
      - app.json with bundle identifiers (com.dealeros.app)
      - expo prebuild --clean
      - eas build --profile development

