  - id: lead-routing-engine
    title: Meta Lead Ads → WhatsApp → AI Lead Routing Engine (KILLER FEATURE)
    prompt: >
      Build the **Meta Lead Ads → WhatsApp → AI Lead Routing Engine** — this
      is the killer feature of DealerOS.


      ## Why this matters

      Automotive dealers spend 60-80% of their marketing budget on Meta Lead
      Ads and Click-to-WhatsApp campaigns. Today those leads land in someone's
      personal WhatsApp, get answered whenever, and 40%+ are lost. DealerOS
      captures every Meta lead, auto-assigns it to the right sales agent using
      AI, and triggers an AI-driven WhatsApp conversation within 30 seconds.


      ## Architecture (4 components)

      ### 1. Meta Lead Ads Webhook Receiver
      File: /workspace/apps/api/src/routes/webhooks/meta-leads.ts

      POST /webhooks/meta/leads (no auth — verified via X-Hub-Signature-256)

      - Verify HMAC SHA-256 signature using META_APP_SECRET env
      - Parse Meta Lead Ads payload (leadgen_id, page_id, form_id, field_data,
        ad_id, adset_id, campaign_id, created_time)
      - Map Meta fields to DealerOS Lead schema:
        - first_name, last_name (from full_name split or direct)
        - email, phone (with country code normalization to E.164)
        - vehicle_interest (parse from "interested_vehicle" field if present)
        - source = "meta_lead_ad" (specific) or "click_to_whatsapp" (CTWA)
        - source_meta = { ad_id, adset_id, campaign_id, form_id, page_id, leadgen_id, raw }
      - Insert into leads table with dealerId (look up dealer from page_id or
        form_id mapping)
      - Trigger routing engine (see below)
      - Return 200 within 5 seconds (Meta retries on slow response)

      GET /webhooks/meta/leads (verification handshake)
      - Return hub.challenge from query param for webhook verification

      ### 2. WhatsApp Cloud API Webhook Receiver
      File: /workspace/apps/api/src/routes/webhooks/whatsapp.ts

      POST /webhooks/whatsapp (no auth — verified via X-Hub-Signature-256)

      - Verify HMAC SHA-256 signature using WHATSAPP_APP_SECRET env
      - Parse WhatsApp Cloud API payload:
        - entry[].changes[].value.messages[] (inbound)
        - entry[].changes[].value.statuses[] (delivery/read receipts)
      - For inbound messages:
        - Extract from (phone E.164), text body, message_id, timestamp
        - Look up existing lead by phone number within same dealer
        - If no lead exists, create one with source="whatsapp_inbound",
          status="new", and the conversation context
        - If lead exists, append message to conversation thread
        - Trigger NOVA agent (LangGraph) to respond within 30 seconds
        - Persist agent run to agent_runs table
      - For status updates:
        - Update communications table with sent/delivered/read state

      GET /webhooks/whatsapp (verification handshake)
      - Return hub.challenge

      ### 3. Lead Routing Engine
      File: /workspace/apps/api/src/services/lead-router.service.ts

      Pure function that takes a Lead and returns the assigned user.

      Strategies (configurable per dealer, defaults applied on first run):

      a) **ROUND_ROBIN** — cycle through active sales reps in the dealer's
         team, skipping anyone marked as away/off-duty
      b) **LOAD_BALANCED** — assign to rep with fewest open leads
      c) **SOURCE_BASED** — meta_lead_ad → rep X, click_to_whatsapp → rep Y,
         walk-in → rep Z (configurable mapping in dealer.settings)
      d) **GEOGRAPHIC** — based on lead's postal code prefix → nearest rep
      e) **VEHICLE_MATCH** — if lead expressed interest in a specific vehicle,
         assign to the rep who sold that vehicle last (or the rep who
         uploaded it)
      f) **AI_SCORED** — let SCORE agent pre-score the lead; high-score leads
         (>80) go to top performer, low-score leads to juniors for practice

      Default priority chain (configurable):
      1. If dealer.settings.routing_strategy = explicit → use it
      2. Else if lead.vehicle_interest has a specific stock_number →
         VEHICLE_MATCH
      3. Else if lead.source_meta has campaign_id → SOURCE_BASED
      4. Else → LOAD_BALANCED

      Returns: { assignedTo: userId, reason: string, alternativeReps: userId[] }
      — alternativeReps are backup reps if assigned user is offline.

      Implementation details:
      - Tenant-scoped (dealerId filter on every user query)
      - Honors rep availability (status=ACTIVE, last activity <2hrs, not in
        meeting)
      - Records routing decision in lead_routing_log table (NEW table —
        add to schema):
        - id, lead_id, dealer_id, strategy_used, candidate_reps, selected_rep,
          reason, scored_at, response_time_ms
      - Returns within 50ms

      ### 4. NOVA Lead Response Agent (LangGraph)
      File: /workspace/apps/api/src/agents/nova.agent.ts

      LangGraph stateful agent that runs on every new lead.

      Workflow:
      1. Receive lead (source, contact info, vehicle interest, source_meta)
      2. Determine channel preference:
         - Click-to-WhatsApp source → WhatsApp first
         - Meta Lead Form with phone → SMS first, email second
         - Meta Lead Form with email only → email first
         - Walk-in → in-person (skip)
      3. Send initial message (template approved by GUARD for compliance):
         "Hi {first_name}, this is {dealer_name}. Thanks for your interest in
          {vehicle}. When works for a quick chat — today, tomorrow, or later
          this week?"
      4. Wait for response (async, persists state to Redis)
      5. On response, run qualification:
         - Timeline: "When are you looking to buy?"
         - Trade-in: "Do you have a trade-in?"
         - Budget: "Are you pre-approved or want financing options?"
         - Vehicle: "Is {vehicle} the one, or exploring options?"
      6. Score lead (call SCORE agent or compute locally with simple rules)
      7. Update lead.status based on responses
      8. Notify assigned rep via Slack/in-app notification with full
         conversation context
      9. If no response in 2 hours → escalate to REVIVE sequence (out of scope
         for Phase 1 but log the trigger)

      For Phase 1, the agent can be a STUB that:
      - Receives the lead
      - Sends a templated WhatsApp message via Cloud API (real call)
      - Logs to agent_runs table
      - Returns run_id
      - Real LangGraph orchestration in Phase 2

      ### 5. WhatsApp Cloud API Client
      File: /workspace/apps/api/src/integrations/whatsapp/client.ts

      - sendTextMessage(to: string, body: string, dealerId: string)
      - sendTemplateMessage(to, templateName, params, dealerId)
      - markMessageAsRead(messageId, dealerId)
      - getMessageStatus(messageId, dealerId)

      Uses WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_ACCESS_TOKEN per dealer.
      Token storage: encrypted in DB (dealer.settings.whatsapp_credentials).

      ### 6. Meta CAPI Integration (for Click-to-WhatsApp ads)
      File: /workspace/apps/api/src/integrations/meta-capi/client.ts

      - sendConversionEvent(eventName, leadId, dealerId)
      - Used to send "Lead" event back to Meta for ad optimization

      ## New database table

      Add to /workspace/packages/db/prisma/schema.prisma:

      model LeadRoutingLog {
        id              String   @id @default(cuid())
        dealerId        String
        leadId          String
        strategyUsed    String
        candidateReps   Json     // [{userId, name, openLeads, lastActive}]
        selectedRepId   String?
        reason          String
        responseTimeMs  Int
        routedAt        DateTime @default(now())

        dealer   Dealer @relation(fields: [dealerId], references: [id], onDelete: Cascade)
        lead     Lead   @relation(fields: [leadId], references: [id], onDelete: Cascade)
        rep      User?  @relation("RoutedLeads", fields: [selectedRepId], references: [id])

        @@index([dealerId])
        @@index([leadId])
        @@index([routedAt])
        @@map("lead_routing_log")
      }

      Also add to Lead model:
      routingLog    LeadRoutingLog[]

      Also add to User model:
      routedLeads   LeadRoutingLog[] @relation("RoutedLeads")

      ## Frontend — Lead Routing Config Page
      File: /workspace/apps/web/src/app/settings/routing/page.tsx

      - Strategy picker (Round Robin, Load Balanced, Source-Based, AI Scored)
      - Rep availability toggles (per sales rep: available, away, off-duty)
      - Source-based mapping (per source: pick a rep)
      - Live preview: "When a Meta Lead Ad comes in from campaign X, it routes
        to {rep}"
      - Recent routing log table (last 100 decisions)

      ## Frontend — Lead detail page
      Add to /workspace/apps/web/src/app/leads/[id]/page.tsx:

      - Show assigned rep with avatar
      - Show routing decision (why this rep, alternative reps considered)
      - Show conversation thread (WhatsApp messages in/out)
      - Show agent activity (NOVA response time, message count)

      ## File layout

      /workspace/apps/api/src/routes/webhooks/
        meta-leads.ts
        whatsapp.ts

      /workspace/apps/api/src/services/
        lead-router.service.ts
        nova-stub.service.ts (Phase 1 stub for NOVA agent)

      /workspace/apps/api/src/agents/
        nova.agent.ts (LangGraph agent definition, stubbed for Phase 1)

      /workspace/apps/api/src/integrations/
        whatsapp/client.ts
        meta-capi/client.ts

      /workspace/apps/api/src/schemas/
        webhook.schema.ts
        lead-router.schema.ts

      ## Environment variables to add

      /workspace/apps/api/.env.example additions:
      ```
      META_APP_SECRET=
      META_VERIFY_TOKEN=
      META_PAGE_ACCESS_TOKEN=
      WHATSAPP_APP_SECRET=
      WHATSAPP_VERIFY_TOKEN=
      WHATSAPP_API_VERSION=v21.0
      WHATSAPP_CLOUD_API_BASE=https://graph.facebook.com
      META_CAPI_PIXEL_ID=
      META_CAPI_ACCESS_TOKEN=
      ```

      ## Verify

      1. `cd /workspace/packages/db && npx prisma validate` passes
      2. `cd /workspace/apps/api && pnpm typecheck` passes
      3. Unit test: lead-router.service.ts with mock users + leads
         - ROUND_ROBIN cycles through 3 reps
         - LOAD_BALANCED picks rep with fewest leads
         - SOURCE_BASED picks correct rep per source
         - VEHICLE_MATCH picks the rep who uploaded
         - Skips offline reps
      4. Integration test: POST /webhooks/meta/leads with sample Meta payload
         - HMAC signature verified
         - Lead created in DB
         - Routing decision made
         - Lead has assignedTo set
         - LeadRoutingLog row created
      5. Integration test: POST /webhooks/whatsapp with sample inbound
         - Signature verified
         - Lead looked up by phone
         - NOVA stub triggered
         - Communication logged
      6. Frontend: /settings/routing renders strategy picker
      7. Frontend: /leads/[id] shows routing decision

      Write deliverable.md at
      /workspace/.mavis/plans/plan_1074f4cf/outputs/lead-routing-engine/deliverable.md
      with explicit `## VERDICT: PASS` line at the end.
    verify_prompt: |
      Verify the lead routing engine:

      1. Run `npx prisma validate` from packages/db — schema is valid
      2. Run `pnpm typecheck` from apps/api — 0 errors
      3. Read lead-router.service.ts:
         - All strategies implemented (ROUND_ROBIN, LOAD_BALANCED,
