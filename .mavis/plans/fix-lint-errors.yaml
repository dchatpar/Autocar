         Files: (auth)/forgot-password/ForgotPasswordForm.tsx:95, (auth)/reset-password/ResetPasswordForm.tsx:156
      4. `jsx-a11y/click-events-have-key-events` — clickable elements need keyboard handler
         Files: customers/DuplicateBadge.tsx:65
