      - For `click-events-have-key-events`: add `onKeyDown` handler to the div/span
      - For `ban-ts-comment`: remove the `// @ts-nocheck` line at the top of layout.tsx
      
      After fixing, run `pnpm eslint src --max-warnings 0` to verify errors are gone.
      If there are remaining errors, fix those too until 0 errors remain.
      
