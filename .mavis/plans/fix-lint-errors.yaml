    title: "fix jsx-a11y errors"
    prompt: |
      Fix ALL ESLint errors (not warnings) in the @dealeros/web source files.
      
      Run this first to get the current error list:
      ```
      cd apps\web ; cmd /c "pnpm eslint src --max-warnings 0 2>&1"
      ```
      
      The errors to fix are in these categories (69 total errors):
      1. `jsx-a11y/label-has-associated-control` — form labels without associated controls
         Files: campaigns/[id]/edit/page.tsx:259, campaigns/new/page.tsx:235, campaigns/AudienceBuilder.tsx:125, (auth)/signup/SignupWizard.tsx:435
      2. `jsx-a11y/no-redundant-roles` — redundant ARIA roles (e.g. `<ul role="list">`)
         Files: (app)/page.tsx:94, customers/CustomerDetailView.tsx:312,351, customers/CustomerListView.tsx:118, customers/DuplicateCompare.tsx:236, customers/DuplicatesView.tsx:180, activity/ActivityTimeline.tsx:181
