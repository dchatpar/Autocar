# ═══════════════════════════════════════════════════════════════
# VERIFIER AGENT — adversarial review for code quality
# ═══════════════════════════════════════════════════════════════

  - id: code-review
    title: 'Code quality review — security, architecture, best practices'
    prompt: |
      Adversarial code review of the entire DealerOS Phase 1 implementation.

      ## Review dimensions

      1. **Security**:
         - No hardcoded secrets, API keys, or JWT secrets in code
         - SQL injection: all queries use parameterized statements (Prisma handles this)
         - Auth: all protected routes properly verify JWT
         - RBAC: role checks on sensitive operations (user deletion, dealer settings)
         - Tenant isolation: every query filters by dealer_id

      2. **Architecture**:
         - Clean separation: API routes vs business logic vs data layer
         - No circular dependencies
         - Consistent error handling pattern
         - Zod validation on all inputs

      3. **Code quality**:
         - No any types in TypeScript (unless absolutely necessary)
         - Proper error handling (try/catch with user-friendly messages)
         - No commented-out code left in
         - Consistent naming conventions

      4. **Frontend**:
         - No API secrets in client-side code
         - Proper loading states (no layout shift)
         - Accessible: keyboard navigation, focus states

      5. **Database**:
         - Proper indexes on foreign keys and frequently queried columns
         - No data loss on migrations
         - Multi-tenancy isolation verified

      ## Files to review
      - /workspace/apps/api/src/**/*.ts
      - /workspace/apps/web/src/**/*.tsx
      - /workspace/packages/db/schema.prisma

      ## Output
      Write findings to /workspace/code-review-findings.md:
      - Each issue: file, line number, severity (critical/major/minor), description, recommendation
      - Summary: critical issues must be fixed before Phase 2
    assigned_to: verifier
    depends_on: [api-crm, api-inventory, frontend-pages, ai-agent-console]
    verified_by: verifier
    verify_prompt: |
      Review code for security vulnerabilities, architectural issues, and quality problems.
      Focus on: SQL injection risk, auth bypass, tenant isolation gaps, hardcoded secrets,
      improper error handling, TypeScript any types, missing indexes.
      Report to code-review-findings.md. Do not modify files.
    timeout_ms: 1800000